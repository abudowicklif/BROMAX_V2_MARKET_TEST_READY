[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bromax-tool"
version = "2.0.0"
description = "Read-only Deriv Digit MATCH research and next-tick shadow testing platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27",
  "websockets>=12,<16",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools]
packages = ["bromax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
